name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          zip tarkov-flip-chimer.zip \
            Check-TarkovPrices.ps1 \
            run.bat \
            config.example.ini \
            chime.wav \
            README.md \
            README.ru.md \
            how-to-get-api-key.png \
            where-to-get-item-name.png

      - name: Resolve release notes from latest PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number // empty')
          NOTES=""
          if [ -n "$PR" ]; then
            NOTES=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --jq '.[-1].body // empty')
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Latest build from main."
          fi
          printf '%s\n' "$NOTES" > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git tag -f latest
          git push -f origin latest
          gh release create latest tarkov-flip-chimer.zip \
            --title "Latest" \
            --notes-file release-notes.md
