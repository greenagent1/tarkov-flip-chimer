name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build zip
        run: |
          zip tarkov-flip-chimer.zip \
            Check-TarkovPrices.ps1 \
            run.bat \
            config.example.ini \
            chime.wav \
            README.md \
            README.ru.md \
            how-to-get-api-key.png \
            where-to-get-item-name.png

      - name: Build changelog and title
        run: |
          PREV_SHA=$(git rev-parse refs/tags/latest 2>/dev/null || echo "")
          {
            echo "## Changes"
            echo
            if [ -n "$PREV_SHA" ] && git cat-file -e "$PREV_SHA" 2>/dev/null; then
              git log "$PREV_SHA"..HEAD --no-merges --pretty=format:'- %s (%h)'
            fi
          } > release-notes.md
          # empty range (e.g. only merge commits since last release, or first
          # ever run with no prior tag) -- fall back to HEAD's own message
          if ! grep -q '^-' release-notes.md; then
            echo "- $(git log -1 --pretty=%s) ($(git rev-parse --short HEAD))" >> release-notes.md
          fi
          echo "TITLE=Build $(date -u +%Y-%m-%d) ($(git rev-parse --short HEAD))" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git tag -f latest
          git push -f origin latest
          gh release create latest tarkov-flip-chimer.zip \
            --title "$TITLE" \
            --notes-file release-notes.md
