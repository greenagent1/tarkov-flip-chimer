; tarkov-flip-chimer — configuration file
; version = 2.0
; (2.0: multi-game-mode support -- pvp/pve/pvps (PvP Season) -- is a
;  bigger surface change than the 1.x line, hence the major bump.)
;
; Copy this file to config.ini and fill in your values.
;
; apiKey is optional. Without it the tool uses tarkov.dev (free, could be slower and less reliable).
; Get a tarkov-market key at: https://tarkov-market.com/dev/api  (see how-to-get-api-key.png)
; For each item, search on tarkov-market.com and use the item name as the query value
;   (see where-to-get-item-name.png).


[General]
apiKey             = YOUR_API_KEY_HERE  ; leave as-is to use tarkov.dev for free
checkIntervalSecs  = 61        ; seconds between price checks
soundFile          = chime.wav ; path to sound file (relative to script folder)
volume             = 5         ; playback volume: 0 (mute) — 100 (full)
gameMode           = pvp       ; pvp (default) | pve | pvps (PvP Season)
;tarkovDevMode     = season    ; (optional) override which json.tarkov.dev/<mode>/
                               ; path feeds the free source. Only needed if the
                               ; automatic pvp->regular / pve->pve / pvps->probe
                               ; mapping picks the wrong thing. tarkov.dev has no
                               ; PvP Season data yet, so gameMode=pvps runs
                               ; paid-only (tarkov-market.app) until it appears --
                               ; the tool probes for it automatically at startup.
windowHeightOffset = 0         ; (optional) tweak auto-computed console height in rows;
                               ; negative shrinks, positive grows (e.g. -7 or +3)
debug              = no        ; (optional) yes = also mirror every rendered frame
                               ; (table + alerts, no colors) to debugFile — useful
                               ; for diagnosing bad data or misaligned columns
debugFile          = analytics/debug-console.txt  ; (optional) path for debug output

; The next two only take effect in two-column mode (see [Column.Break]
; below), but live here because they apply symmetrically to BOTH the buy
; and sell side -- not "the right column's settings".
;alertWrapAfter    = 10         ; buy alerts always render in the left half,
                               ; sell always in the right (never mixed).
                               ; Once either side exceeds this many rows,
                               ; it wraps into its own extra sub-column(s)
                               ; instead of growing taller. Takes priority
                               ; over splitTriggers when both are set.
;splitTriggers     = no         ; yes = split the bottom alert list by which
                               ; item-column it came from (left-column
                               ; triggers bottom-left, right-column bottom-
                               ; right). Used while alert counts are under
                               ; alertWrapAfter, or on its own if
                               ; alertWrapAfter isn't set.

; -----------------------------------------------------------------------
; [Logging]  — optional. Append a JSON Lines entry per cycle to a log file.
;
; enabled    : no (default)  — turn the JSON log off
;              yes           — append one line per cycle
;
; A new line is written only when at least one item's current price
; changed since the previous cycle (the very first cycle is always
; written so the starting state is captured). Each line mirrors the
; data shown on screen.
;
; path       : prices.log.jsonl (default) — relative to the script folder
;
; maxEntries : (optional) keep at most N most recent lines on startup
; maxSizeKB  : (optional) trim oldest lines on startup so the file fits
;              in N KB. Both can be set; whichever is more strict wins.
;              Leave empty for no limit.
; -----------------------------------------------------------------------
[Logging]
enabled    = no
path       = analytics/prices.log.jsonl
maxEntries =
maxSizeKB  =

; -----------------------------------------------------------------------
; [Item.<Label>]  — one section per monitored item
;
; query      : search string sent to the API — use Name or ShortName from tarkov-market.com
;
; label      : (optional) display name shown in the table. Defaults to the
;              part after "Item." in the section header. Use this when you
;              want two sections with the same display label — e.g. one
;              buy and one sell tracker for the same item:
;                [Item.BitcoinBuy]   label = Bitcoin   alert = B7%
;                [Item.BitcoinSell]  label = Bitcoin   alert = S7%
;
; used       : no (default) — pick the most expensive variant (new, 100/100)
;              yes          — pick the cheapest variant (worn/depleted, e.g. 1/100)
;
; avgSource  : avg7d        — 7-day average from API (default)
;              avg24h       — 24-hour average from API
;              <decimal>    — weighted blend of the two: w controls how far
;                             refAvg sits from avg7d toward avg24h.
;                               refAvg = avg7d + w * (avg24h - avg7d)
;                             0.0  = pure avg7d (most stable, slow)
;                             0.5  = midpoint
;                             1.0  = pure avg24h (most responsive, noisy)
;                             0.7  = mostly 24h, smoothed slightly toward 7d
;                             1.3  = extrapolates past avg24h, amplifying
;                                    the gap between 7d and 24h (i.e. the
;                                    recent trend). Useful when you want
;                                    minor noise ignored but real shifts
;                                    in the average to count more.
;                             A decimal point is required to be read as a
;                             weight (so "1.0" is the weight; "1" is a
;                             fixed price of 1 ₽).
;              <integer>    — fixed manual reference price
;              Both avg24h and avg7d are always shown in the output columns.
;              avgSource only selects what drives Diff% and the alert trigger.
;              In free mode (no API key) avg7d isn't available, so avg7d
;              and any decimal weight fall back to avg24h.
;
; alert      : B<number>%   — trigger when price drops more than N% below avgSource
;              S<number>%   — trigger when price rises more than N% above avgSource
;              B<number>    — trigger when price drops below a fixed value
;              S<number>    — trigger when price rises above a fixed value
;              B/S prefix is optional, defaults to B (buy)
;
; sound      : yes (default) — play the chime when this item triggers
;              no            — stay silent for this item; it still shows in
;                              the table, highlights, and appears in the
;                              bottom alert list — only the sound is muted
; -----------------------------------------------------------------------


; -----------------------------------------------------------------------
; [Separator.<Label>]  — inserts a labeled divider line between item rows
;
; color : DarkGray (default) — any PowerShell ConsoleColor name
;                              or #RRGGBB hex, e.g. color = #8B4513
; -----------------------------------------------------------------------


; -----------------------------------------------------------------------
; [Column.Break]  — optional. If present, splits output into two columns
; separated by a vertical bar. Sections above this line render in the
; left column, sections below in the right. The window becomes ~2x wider
; and ~2x shorter. Without [Column.Break], the original single-column
; layout is used. This section holds no keys of its own -- its mere
; presence (and position in the file) is what triggers two-column mode.
;
; The bottom alert list's layout (alertWrapAfter / splitTriggers) is
; configured in [General] above, not here -- it applies symmetrically to
; both the buy and sell side, not just one column.
; -----------------------------------------------------------------------


[Separator.Armor & Gear]
color = DarkCyan

; Buy alert — notify when price drops below a fixed threshold
[Item.PACA]
query     = PACA Soft Armor
alert     = 29000

; Buy alert — 15% below 7-day average
[Item.WaterFilter]
query     = water filter
avgSource = avg7d
alert     = B15%

[Separator.Valuables]
color = #8B6914

; Uncomment the next line to display the items below in a second column
; (right side), keeping items above in the left column. Then uncomment
; alertWrapAfter / splitTriggers in [General] above if you also want
; the bottom alert list laid out across both columns.
; [Column.Break]

; Sell alert — notify when price rises above a fixed threshold
[Item.Hawk]
query     = Gunpowder "Hawk"
alert     = S25000

; Sell alert — notify when price rises more than 7% above 24-hour average
[Item.Bitcoin]
query     = physical bitcoin
avgSource = avg24h
alert     = S7%

; Same item tracked in two directions, both showing as "GPU" in the table.
; Buy if price drops 12% below a smoothed avg (mostly 24h, slightly anchored to 7d).
[Item.GpuBuy]
query     = Graphics card
label     = GPU
avgSource = 0.7
alert     = B12%

; Sell if price rises 10% above a trend-amplified avg (pushes past 24h
; in the direction the 7d→24h shift points to).
[Item.GpuSell]
query     = Graphics card
label     = GPU
avgSource = 1.3
alert     = S10%
